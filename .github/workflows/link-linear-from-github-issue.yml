name: Link Linear issue from GitHub issue

on:
  workflow_dispatch:
    inputs:
      pr_state:
        description: Which existing pull requests to inspect
        required: true
        default: open
        type: choice
        options:
          - open
          - closed
          - all
      dry_run:
        description: Preview changes without updating PR bodies
        required: true
        default: true
        type: boolean

  pull_request:
    types:
      - opened
      - edited
      - reopened
      - ready_for_review
      - synchronize

permissions:
  contents: read
  pull-requests: write

jobs:
  link-linear-issue:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout workflow scripts
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Add Linear issue reference to PR body
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          BACKFILL_EXISTING_PRS: ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}
          BACKFILL_PR_STATE: ${{ github.event_name == 'workflow_dispatch' && inputs.pr_state || 'open' }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
        run: node scripts/link-linear-from-github-issue.mjs
